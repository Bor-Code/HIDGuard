name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract Tag Version
        id: extract_version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build Package
        shell: pwsh
        run: |
          ./scripts/package.ps1 -Version "${{ steps.extract_version.outputs.version }}" -Configuration Release -OutputDir "./artifacts"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build Installer Package
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1 -Version "${{ steps.extract_version.outputs.version }}" -Configuration Release -OutputDir "./artifacts"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/*.zip
            ./artifacts/*.exe
            ./artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
